<!-- EVALUACIÓN DE SATISFACCIÓN DE LA ENTREGA DE RACIÓN INDUSTRIALIZADA (RI) -->
<div class="survey-form">
    <form id="racion-industrializada-form">
        <div class="form-all">
            <ul class="form-section page-section">
                <li class="form-line" data-type="control_image">
                    <div class="form-input-wide">
                        <div style="text-align:center">
                            <img alt="Logo" style="border:0" src="https://www.jotform.com/uploads/juanpamartinezro/form_files/alcaldia_envigado_salud.68925d7c835838.31118812.png" height="100px" width="178px" />
                        </div>
                    </div>
                </li>
                <li class="form-input-wide" data-type="control_head">
                    <div class="form-header-group hasImage header-large">
                        <h1 class="form-header">Formulario de satisfacción Ración Industrializada (RI)</h1>
                        <div class="form-subHeader">Por favor, califica el complemento y el servicio usando la escala.</div>
                    </div>
                </li>

                <li class="form-line" data-type="control_text">
                    <label class="form-label form-label-top">Modalidad</label>
                    <div class="form-input-wide">
                        <div class="form-html"><p><strong>Ración Industrializada (RI)</strong></p></div>
                        <input type="hidden" name="modalidad" value="Ración Industrializada (RI)" />
                    </div>
                </li>

                <li class="form-line" data-type="control_datetime">
                    <label class="form-label form-label-top">Fecha</label>
                    <div class="form-input-wide">
                        <input type="date" name="fecha" class="form-textbox" />
                    </div>
                </li>
                <!-- Se conserva el nombre de campo "institucion" para que reportes y filtros sigan funcionando -->
                <li class="form-line jf-required" data-type="control_widget">
                    <label class="form-label form-label-top">¿En qué comedor recibe la ración?<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <select name="institucion" class="form-dropdown validate[required]" required>
                            <option value="">Seleccione un comedor</option>
                            <option value="Comedor Santa Gertrudis">Comedor Santa Gertrudis</option>
                            <option value="Comedor El Salado">Comedor El Salado</option>
                            <option value="Comedor La Mina">Comedor La Mina</option>
                            <option value="Comedor Uribe Ángel">Comedor Uribe Ángel</option>
                            <option value="Comedor San Rafael">Comedor San Rafael</option>
                        </select>
                    </div>
                </li>
                <li class="form-line jf-required" data-type="control_radio">
                    <label class="form-label form-label-top">Género<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <div class="form-single-column">
                            <span class="form-radio-item">
                                <input type="radio" name="genero" value="Hombre" required />
                                <label>Hombre</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="genero" value="Mujer" required />
                                <label>Mujer</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="genero" value="Otro" required />
                                <label>Otro</label>
                            </span>
                        </div>
                    </div>
                </li>
                <li class="form-line jf-required" data-type="control_textbox">
                    <label class="form-label form-label-top">Edad<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <input type="number" name="edad" class="form-textbox validate[required]" min="1" max="120" step="1" inputmode="numeric" placeholder="Años" required />
                    </div>
                </li>
                <li class="form-line" data-type="control_text">
                    <div class="form-input-wide">
                        <div class="form-html">
                            <p><strong>Califica los siguientes aspectos del complemento como:</strong></p>
                            <p>1 Malo</p>
                            <p>2 Regular</p>
                            <p>3 Bueno</p>
                            <p>4 Excelente</p>
                        </div>
                    </div>
                </li>
                <!-- Preguntas de evaluación (se conservan los nombres de campo anteriores) -->
                <li class="form-line jf-required" data-type="control_radio">
                    <label class="form-label form-label-top">La calidad de los alimentos entregados.<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <div class="form-single-column">
                            <span class="form-radio-item">
                                <input type="radio" name="calidad_alimentos" value="1 Malo" required />
                                <label>1 Malo</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="calidad_alimentos" value="2 Regular" required />
                                <label>2 Regular</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="calidad_alimentos" value="3 Bueno" required />
                                <label>3 Bueno</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="calidad_alimentos" value="4 Excelente" required />
                                <label>4 Excelente</label>
                            </span>
                        </div>
                    </div>
                </li>
                <li class="form-line jf-required" data-type="control_radio">
                    <label class="form-label form-label-top">La variedad de los menús ofrecidos.<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <div class="form-single-column">
                            <span class="form-radio-item">
                                <input type="radio" name="variedad_menus" value="1 Malo" required />
                                <label>1 Malo</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="variedad_menus" value="2 Regular" required />
                                <label>2 Regular</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="variedad_menus" value="3 Bueno" required />
                                <label>3 Bueno</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="variedad_menus" value="4 Excelente" required />
                                <label>4 Excelente</label>
                            </span>
                        </div>
                    </div>
                </li>
                <li class="form-line jf-required" data-type="control_radio">
                    <label class="form-label form-label-top">La presentación de los alimentos entregados.<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <div class="form-single-column">
                            <span class="form-radio-item">
                                <input type="radio" name="presentacion_alimentos" value="1 Malo" required />
                                <label>1 Malo</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="presentacion_alimentos" value="2 Regular" required />
                                <label>2 Regular</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="presentacion_alimentos" value="3 Bueno" required />
                                <label>3 Bueno</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="presentacion_alimentos" value="4 Excelente" required />
                                <label>4 Excelente</label>
                            </span>
                        </div>
                    </div>
                </li>
                <li class="form-line jf-required" data-type="control_radio">
                    <label class="form-label form-label-top">La oportunidad en la entrega de los alimentos a los usuarios.<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <div class="form-single-column">
                            <span class="form-radio-item">
                                <input type="radio" name="entrega_oportuna" value="1 Malo" required />
                                <label>1 Malo</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="entrega_oportuna" value="2 Regular" required />
                                <label>2 Regular</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="entrega_oportuna" value="3 Bueno" required />
                                <label>3 Bueno</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="entrega_oportuna" value="4 Excelente" required />
                                <label>4 Excelente</label>
                            </span>
                        </div>
                    </div>
                </li>
                <li class="form-line jf-required" data-type="control_radio">
                    <label class="form-label form-label-top">El trato y la atención de las manipuladoras de alimentos.<span class="form-required">*</span></label>
                    <div class="form-input-wide jf-required">
                        <div class="form-single-column">
                            <span class="form-radio-item">
                                <input type="radio" name="manipuladoras_amables" value="1 Malo" required />
                                <label>1 Malo</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="manipuladoras_amables" value="2 Regular" required />
                                <label>2 Regular</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="manipuladoras_amables" value="3 Bueno" required />
                                <label>3 Bueno</label>
                            </span>
                            <span class="form-radio-item">
                                <input type="radio" name="manipuladoras_amables" value="4 Excelente" required />
                                <label>4 Excelente</label>
                            </span>
                        </div>
                    </div>
                </li>
                <li class="form-line" data-type="control_button">
                    <div class="form-input-wide">
                        <button type="submit" class="form-submit-button">Enviar</button>
                    </div>
                </li>
            </ul>
        </div>
    </form>
</div>
